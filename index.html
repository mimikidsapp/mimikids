<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MimiKids - Aprende Jugando</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #292F36;
            --light: #F7FFF7;
            --purple: #A29BFE;
            --green: #55EFC4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--dark);
        }

        .app-container {
            background: white;
            width: 100%;
            max-width: 900px;
            min-height: 600px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 6px solid white;
        }

        /* HEADER / BARRA SUPERIOR */
        header {
            background: var(--primary);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-pill {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .btn-logout {
            background: var(--dark);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-logout:hover {
            transform: scale(1.05);
            background: #ff4757;
        }

        /* PANTALLA DE LOGIN / REGISTRO */
        #auth-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .auth-card {
            background: var(--light);
            padding: 35px;
            border-radius: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 3px solid var(--secondary);
        }

        .auth-card h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 26px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 15px;
            border: 2px solid #ddd;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--secondary);
        }

        .avatar-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
        }

        .avatar-option {
            font-size: 32px;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            background: white;
            transition: transform 0.2s;
        }

        .avatar-option.selected {
            border-color: var(--primary);
            transform: scale(1.15);
            background: var(--accent);
        }

        .btn-main {
            width: 100%;
            background: var(--secondary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #3bb3ab;
            transition: all 0.1s;
            margin-top: 10px;
        }

        .btn-main:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #3bb3ab;
        }

        .switch-auth {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            text-decoration: underline;
        }

        .saved-accounts {
            margin-top: 25px;
            width: 100%;
            max-width: 420px;
        }

        .saved-accounts h4 {
            margin-bottom: 10px;
            color: var(--dark);
        }

        .account-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .account-chip {
            background: white;
            border: 2px solid var(--purple);
            padding: 6px 14px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .account-chip:hover {
            background: var(--purple);
            color: white;
        }

        /* PANTALLA PRINCIPAL (DASHBOARD) */
        #dashboard-screen {
            display: none;
            flex: 1;
            padding: 30px;
            flex-direction: column;
            gap: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: var(--light);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 5px solid #ddd;
        }

        .stat-icon {
            font-size: 40px;
            background: white;
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .stat-info h3 {
            font-size: 24px;
            color: var(--dark);
        }

        .stat-info p {
            font-size: 14px;
            color: #666;
        }

        /* BARRA DE PROGRESO GENERAL */
        .progress-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .progress-bar-bg {
            width: 100%;
            height: 22px;
            background: #e9ecef;
            border-radius: 50px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--green));
            width: 0%;
            transition: width 0.5s ease;
        }

        /* MÓDULOS DE JUEGO */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            border: 3px solid #eee;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            position: relative;
        }
